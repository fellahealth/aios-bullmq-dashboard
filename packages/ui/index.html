<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="robots" content="noindex" />
    <base href="<%= basePath %>" />
    <title><%= title %></title>
    <link rel="alternate icon" type="image/png" href="<%= favIconAlternative %>" />
    <link rel="icon" type="image/svg+xml" id="fav-logo" href="<%= favIconDefault %>" />
    <script>
      // Apply theme before first paint to avoid flash. Keep in sync with src/lib/theme.ts.
      (function () {
        try {
          var t = localStorage.getItem('aios-bullmq-theme') || 'system';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased">
    <script id="__UI_CONFIG__" type="application/json"><%- uiConfig %></script>
    <div id="root">
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:0.75rem;font-family:Inter,system-ui,sans-serif;font-size:0.85rem;letter-spacing:0.05em;color:var(--color-fg-subtle,#71717a);">
        <span style="display:flex;gap:0.5rem;">
          <span style="width:0.5rem;height:0.5rem;border-radius:50%;background:currentColor;animation:bb-pulse 1.2s ease-in-out infinite;"></span>
          <span style="width:0.5rem;height:0.5rem;border-radius:50%;background:currentColor;animation:bb-pulse 1.2s ease-in-out 0.15s infinite;"></span>
          <span style="width:0.5rem;height:0.5rem;border-radius:50%;background:currentColor;animation:bb-pulse 1.2s ease-in-out 0.3s infinite;"></span>
        </span>
        Loading dashboard…
      </div>
      <style>@keyframes bb-pulse{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
